<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>SBC Diffuser</title>
    <link rel="stylesheet" href="/src/style.scss" />
  </head>
  <body>
    <header>
      <h1>SBC Diffuser</h1>
    </header>

    <main>
      <form id="workbook-form">
        <label for="workbook-file">Workbook (.xlsx)</label>
        <input
          id="workbook-file"
          name="workbook"
          type="file"
          accept=".xlsx,application/vnd.openxmlformats-officedocument.spreadsheetml.sheet"
          aria-describedby="workbook-help"
          required
        />
        <small id="workbook-help"> E*TRADE By Benefit Type workbook. </small>
        <button type="submit">Import workbook</button>
      </form>
    </main>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
